name: 'olist_cloud'
version: '1.0.0'
config-version: 2
profile: 'olist_cloud' # Harus sama dengan nama di profiles.yml

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  olist_cloud:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts